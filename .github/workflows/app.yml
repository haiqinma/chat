name: Release App

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: Optional desktop version, for example v0.0.63
        required: false
        type: string
  release:
    types: [published]

jobs:
  build-macos-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-release

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Apple signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build release bundle
        env:
          BUILD_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.build_version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CENTRAL_UCAN_AUTH_BASE_URL: ${{ vars.CENTRAL_UCAN_AUTH_BASE_URL }}
          CENTRAL_UCAN_APP_ID: ${{ vars.CENTRAL_UCAN_APP_ID }}
          CENTRAL_UCAN_REDIRECT_URI: ${{ vars.CENTRAL_UCAN_REDIRECT_URI || 'http://tauri.localhost/central-ucan-callback.html' }}
        run: npm run app:build:release

      - name: Verify macOS installer
        run: |
          codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/Chat.app
          hdiutil verify src-tauri/target/release/bundle/macos/*.dmg
          spctl --assess --type open --context context:primary-signature --verbose=4 src-tauri/target/release/bundle/macos/*.dmg

      - name: Generate updater manifest
        if: github.event_name == 'release'
        run: |
          node ./scripts/generate-updater-manifest.mjs \
            --repo "${{ github.repository }}" \
            --tag "${{ github.event.release.tag_name }}" \
            --pub-date "${{ github.event.release.published_at }}"

      - name: Verify release updater assets
        if: github.event_name == 'release'
        run: |
          test -s src-tauri/target/release/bundle/macos/Chat.app.tar.gz
          test -s src-tauri/target/release/bundle/macos/Chat.app.tar.gz.sig
          test -s src-tauri/target/release/bundle/macos/latest.json
          node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync('src-tauri/target/release/bundle/macos/latest.json','utf8')); if (!manifest.platforms?.['darwin-aarch64']?.url || !manifest.platforms?.['darwin-aarch64']?.signature) throw new Error('Invalid macOS updater manifest');"

      - name: Upload workflow package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-desktop-release
          path: |
            src-tauri/target/release/bundle/macos/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

      - name: Upload updater manifest artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: macos-updater-manifest
          path: src-tauri/target/release/bundle/macos/latest.json
          if-no-files-found: error

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            src-tauri/target/release/bundle/macos/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/macos/latest.json

  build-windows-verification:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-verification

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows verification bundle
        env:
          BUILD_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.build_version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CENTRAL_UCAN_AUTH_BASE_URL: ${{ vars.CENTRAL_UCAN_AUTH_BASE_URL }}
          CENTRAL_UCAN_APP_ID: ${{ vars.CENTRAL_UCAN_APP_ID }}
          CENTRAL_UCAN_REDIRECT_URI: ${{ vars.CENTRAL_UCAN_REDIRECT_URI || 'http://tauri.localhost/central-ucan-callback.html' }}
        run: npm run app:build:release

      - name: Prepare Windows release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $rawVersion = "${{ github.event_name == 'release' && github.event.release.tag_name || inputs.build_version }}"
          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
            $rawVersion = node -p "require('./src-tauri/tauri.conf.json').version"
          }
          $normalizedVersion = $rawVersion -replace '^refs/tags/', ''
          $normalizedVersion = $normalizedVersion -replace '^[vV]', ''
          $version = "v$normalizedVersion"

          $msi = Get-ChildItem -Path 'src-tauri/target/release/bundle' -Recurse -Filter '*.msi' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            throw 'No Windows MSI installer found under src-tauri/target/release/bundle'
          }

          $dest = "chat-$version-Windows.msi"
          Copy-Item $msi.FullName (Join-Path 'release-assets' $dest) -Force
          Write-Host "Windows MSI prepared: $dest"

      - name: Upload Windows verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-verification
          path: release-assets/*.msi
          if-no-files-found: error

      - name: Upload Windows release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-assets/*.msi

  build-ubuntu24-04-verification:
    name: build-ubuntu24.04-verification
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu24.04-verification

      - name: Install Ubuntu desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Ubuntu verification bundle
        env:
          BUILD_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.build_version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CENTRAL_UCAN_AUTH_BASE_URL: ${{ vars.CENTRAL_UCAN_AUTH_BASE_URL }}
          CENTRAL_UCAN_APP_ID: ${{ vars.CENTRAL_UCAN_APP_ID }}
          CENTRAL_UCAN_REDIRECT_URI: ${{ vars.CENTRAL_UCAN_REDIRECT_URI || 'http://tauri.localhost/central-ucan-callback.html' }}
        run: npm run app:build:release

      - name: Prepare Ubuntu 24.04 release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          RAW_VERSION="${{ github.event_name == 'release' && github.event.release.tag_name || inputs.build_version }}"
          if [ -z "$RAW_VERSION" ]; then
            RAW_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          NORMALIZED_VERSION="${RAW_VERSION#refs/tags/}"
          NORMALIZED_VERSION="${NORMALIZED_VERSION#v}"
          NORMALIZED_VERSION="${NORMALIZED_VERSION#V}"
          VERSION="v${NORMALIZED_VERSION}"

          DEB="$(find src-tauri/target/release/bundle -name '*.deb' -type f | head -1 || true)"
          if [ -z "$DEB" ]; then
            echo "No Ubuntu .deb installer found under src-tauri/target/release/bundle" >&2
            exit 1
          fi

          DEST="chat-${VERSION}-Ubuntu24.04-x86_64.deb"
          cp "$DEB" "release-assets/$DEST"
          echo "Ubuntu 24.04 deb prepared: $DEST"

      - name: Upload Ubuntu verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu24.04-desktop-verification
          path: release-assets/*.deb
          if-no-files-found: error

      - name: Upload Ubuntu 24.04 release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-assets/*.deb
